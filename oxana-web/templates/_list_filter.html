<div class="flex flex-wrap items-center gap-3 mb-4">
    <label for="list-filter" class="text-sm text-gray-400">{{ filter_label }}</label>
    <input id="list-filter" type="search" autocomplete="off" placeholder="Type a name…" class="w-full sm:w-72 rounded bg-gray-900 border border-gray-800 px-3 py-1.5 text-sm text-gray-200">
    <span id="filter-count" class="text-xs text-gray-500" role="status" aria-live="polite"></span>
</div>
<p id="filter-empty" hidden class="mb-4 text-sm text-gray-500">No matches. Clear the filter to show everything.</p>
